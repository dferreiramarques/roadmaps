<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Roadmaps · Admin</title>
  <script src="/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar__in">
      <a class="brand" href="/">
        <span class="brand__mark" aria-hidden="true">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h6M4 12h10M4 18h14"/><circle cx="17" cy="6" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </span>
        Roadmaps
      </a>

      <div class="seg" id="products" role="group" aria-label="Product" hidden></div>

      <span class="grow"></span>

      <div class="actions" id="actions" hidden>
        <button class="btn btn--outline" id="btn-import" title="Add or update products from a roadmaps.json file">Import</button>
        <button class="btn btn--outline" id="btn-export" title="Download everything as roadmaps.json">Export</button>
        <button class="btn btn--text" id="btn-signout">Sign out</button>
      </div>
      <button class="btn btn--text btn--icon" id="btn-theme" aria-label="Toggle light / dark theme" title="Toggle theme"></button>
    </div>
  </header>

  <!-- sign in -->
  <section class="login" id="login" hidden>
    <form class="login__card" id="login-form">
      <h1>Admin</h1>
      <p id="login-msg">Enter the admin token to edit the roadmaps.</p>
      <div class="field">
        <label for="token">Token</label>
        <input class="input" id="token" type="password" autocomplete="current-password" required />
      </div>
      <p class="login__err" id="login-err" role="alert"></p>
      <button class="btn btn--primary" type="submit" id="login-btn">Sign in</button>
    </form>
  </section>

  <!-- editor -->
  <main class="wrap" id="app" hidden>
    <section class="hero" id="hero"></section>
    <section class="cols" id="cols" aria-label="Roadmap"></section>
    <p class="note">Changes are saved automatically. Drag cards between columns, or use the ‹ › buttons (keyboard: <code>Alt</code> + arrows). Public products appear on the site and in embeds straight away.</p>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <input type="file" id="file" accept="application/json,.json" hidden />

  <script src="/js/admin.js"></script>
</body>
</html>
